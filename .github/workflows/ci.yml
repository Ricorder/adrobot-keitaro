name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Зависимости
        run: pip install -e ".[dev]"

      - name: Линтер
        run: ruff check app tests

      - name: Форматирование
        run: ruff format --check app tests

      - name: Тесты
        run: pytest -q

      - name: Миграции на SQLite
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  postgres-migrations:
    runs-on: ubuntu-latest
    needs: backend
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adrobot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -e ".[dev,postgres]"

      - name: Миграции на PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/adrobot
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Типы
        run: pnpm exec tsc --noEmit

      - name: Сборка
        run: pnpm run build
