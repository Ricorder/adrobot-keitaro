[project]
name = "adrobot-backend"
version = "0.1.0"
description = "Adrobot: обёртка над Keitaro — создаватель кампаний и редактор офферов в потоках"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]
# Для запуска на Postgres: pip install -e ".[postgres]" и DATABASE_URL=postgresql+psycopg://...
postgres = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень бэкенда в sys.path: тесты импортируют tools.mock_keitaro, а консольный `pytest`
# (в отличие от `python -m pytest`) текущий каталог туда не добавляет.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003 помечают кириллицу в строках, докстрингах и комментариях как символ,
# похожий на латиницу. Русский язык в коде намеренный, поэтому эти правила выключены.
ignore = ["RUF001", "RUF002", "RUF003"]

